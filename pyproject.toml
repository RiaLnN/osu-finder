[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-finder"
version = "0.2.0"
description = "Automated osu! beatmap finder — local PP/SR calculation via rosu-pp-py, mod-aware filtering, and profile-based preset generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["osu", "beatmap", "rosu-pp", "rhythm-game"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "rosu-pp-py>=4.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/yourname/osu-finder"
Issues = "https://github.com/yourname/osu-finder/issues"

[project.scripts]
osu-finder = "osu_finder.cli:main"

[tool.setuptools.packages.find]
include = ["osu_finder*"]